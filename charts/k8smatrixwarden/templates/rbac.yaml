apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8smw.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "k8smw.labels" . | nindent 4 }}
---
# Read-only: get and list, nothing else. The scanner has no way to change the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "k8smw.name" . }}
  labels: {{- include "k8smw.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, namespaces, nodes, serviceaccounts, configmaps, endpoints, resourcequotas, limitranges, persistentvolumes, persistentvolumeclaims, events{{ if .Values.rbac.readSecrets }}, secrets{{ end }}]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, statefulsets, replicasets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings, clusterroles, clusterrolebindings]
    verbs: [get, list]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations, validatingwebhookconfigurations]
    verbs: [get, list]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "k8smw.name" . }}
  labels: {{- include "k8smw.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "k8smw.name" . }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "k8smw.name" . }}, namespace: {{ .Release.Namespace }}}

# DVKA: Damn Vulnerable Kubernetes Application. INTENTIONALLY INSECURE.
# Apply only to a disposable local cluster. See eval/README.md.
# ---- SEC-01: Secret injected through an environment variable  [expects: sec-env-var-secrets]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-env-secret
  namespace: dvka-vuln
  labels:
    app: sec-env-secret
    app.kubernetes.io/part-of: dvka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sec-env-secret
  template:
    metadata:
      labels:
        app: sec-env-secret
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
---
# ---- SEC-02: ConfigMap holding a password  [expects: sec-configmap-credentials]
apiVersion: v1
kind: ConfigMap
metadata:
  name: sec-cm-password
  namespace: dvka-vuln
  labels:
    app.kubernetes.io/part-of: dvka
data:
  db_password: hunter2
---
# ---- SEC-03: ConfigMap holding an API key in a value  [expects: sec-configmap-credentials]
apiVersion: v1
kind: ConfigMap
metadata:
  name: sec-cm-apikey
  namespace: dvka-vuln
  labels:
    app.kubernetes.io/part-of: dvka
data:
  settings: api_key=AKIAIOSFODNN7EXAMPLE
---
# ---- SEC-04: Cloud credentials file mounted into the pod  [expects: sec-mounted-cloud-creds]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sec-cloud-creds
  namespace: dvka-vuln
  labels:
    app: sec-cloud-creds
    app.kubernetes.io/part-of: dvka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sec-cloud-creds
  template:
    metadata:
      labels:
        app: sec-cloud-creds
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: c
          mountPath: /root/.aws/credentials
          subPath: credentials
      volumes:
      - name: c
        secret:
          secretName: aws-credentials

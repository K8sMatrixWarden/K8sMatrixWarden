# DVKA: Damn Vulnerable Kubernetes Application. INTENTIONALLY INSECURE.
# Apply only to a disposable local cluster. See eval/README.md.
# ---- WL-01: Privileged container  [expects: workload-privileged-container, workload-allow-priv-escalation]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wl-privileged
  namespace: dvka-vuln
  labels:
    app: wl-privileged
    app.kubernetes.io/part-of: dvka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wl-privileged
  template:
    metadata:
      labels:
        app: wl-privileged
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: registry.k8s.io/pause:3.9
        securityContext:
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          privileged: true
        resources:
          limits:
            cpu: 250m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
---

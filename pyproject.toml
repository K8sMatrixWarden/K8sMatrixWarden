[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8smatrixwarden"
version = "1.0.0"
description = "MITRE ATT&CK-aligned, domain-sharded Kubernetes security scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "K8s-Dev-1" }]
keywords = ["kubernetes", "security", "mitre", "attack", "scanner", "k8s"]

# Core has ZERO required dependencies — it runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
# Live cluster scanning
live = ["kubernetes>=28.0"]
# Scan YAML / Helm charts before deploy (scan --manifests, check)
manifests = ["pyyaml>=6"]
# Prettier terminal output
pretty = ["rich>=13.0"]
# Everything above
all = ["kubernetes>=28.0", "pyyaml>=6", "rich>=13.0"]
dev = ["pytest>=7.0"]

[project.scripts]
k8smatrixwarden = "k8smatrixwarden.cli.main:main"

[tool.setuptools.packages.find]
include = ["k8smatrixwarden*"]

[tool.setuptools.package-data]
k8smatrixwarden = ["data/fixtures/*.json", "taxonomy/*.json", "config/*.json", "web/vendor/*.js"]

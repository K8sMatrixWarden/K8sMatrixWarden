[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k8smatrixwarden"
version = "1.0.0"
description = "MITRE ATT&CK-aligned, domain-sharded Kubernetes security scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "K8s-Dev-1" }]
keywords = ["kubernetes", "security", "mitre", "attack", "scanner", "k8s"]

# Core has ZERO required dependencies — it runs on the standard library alone.
dependencies = []

[project.optional-dependencies]
# Live cluster scanning
live = ["kubernetes>=28.0"]
# Prettier terminal output
pretty = ["rich>=13.0"]
# MCP protocol server
mcp = ["mcp>=1.0"]
# PDF report export
pdf = ["fpdf2>=2.7"]
# Excel workbook export
excel = ["openpyxl>=3.1"]
# Optional LLM-driven orchestration for the local `chat` REPL (multi-step tool chaining)
agent = ["anthropic>=0.40"]
# Everything
all = ["kubernetes>=28.0", "rich>=13.0", "mcp>=1.0", "fpdf2>=2.7", "openpyxl>=3.1", "anthropic>=0.40"]
dev = ["pytest>=7.0"]

[project.scripts]
k8smatrixwarden = "k8smatrixwarden.cli.main:main"

[tool.setuptools.packages.find]
include = ["k8smatrixwarden*"]

[tool.setuptools.package-data]
k8smatrixwarden = ["data/fixtures/*.json", "taxonomy/*.json", "config/*.json", "web/vendor/*.js"]
